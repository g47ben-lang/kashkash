name: Convert RVC models (.pth → .onnx)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-${{ hashFiles('scripts/requirements_export.txt') }}

      - name: Install dependencies
        run: pip install -r scripts/requirements_export.txt

      - name: Download RVC models from Hugging Face
        run: |
          mkdir -p models/pth
          cd /tmp

          echo "Downloading Bibi model..."
          wget -q --show-progress -O bibi.zip \
            https://huggingface.co/pipi00pipi/benjamin_netanyahu/resolve/main/bibi.zip
          unzip -q bibi.zip -d bibi_extracted

          echo "Downloading Trump model..."
          wget -q --show-progress -O trump.zip \
            https://huggingface.co/ThompsonAI9/ThompsonAI9RVC/resolve/main/donaldtrumplowenergy.zip
          unzip -q trump.zip -d trump_extracted

          echo "Copying .pth files (ignoring __MACOSX and .index files)..."
          find bibi_extracted trump_extracted \
            -name "*.pth" \
            ! -path "*/__MACOSX/*" \
            -exec cp {} $GITHUB_WORKSPACE/models/pth/ \;

          echo "Models ready:"
          ls -lh $GITHUB_WORKSPACE/models/pth/

      - name: Clone RVC source (for architecture code only)
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI /tmp/rvc_src
          # Copy only the model architecture files we need
          cp -r /tmp/rvc_src/lib /tmp/rvc_lib 2>/dev/null || true
          cp -r /tmp/rvc_src/infer /tmp/rvc_infer 2>/dev/null || true
          cp /tmp/rvc_src/*.py /tmp/rvc_src_root/ 2>/dev/null || true

      - name: Convert models
        run: |
          mkdir -p app/src/main/assets/models
          python scripts/export_rvc_to_onnx.py \
            --rvc-src /tmp/rvc_src \
            --models models/pth/*.pth \
            --output app/src/main/assets/models

      - name: Commit converted models
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/models/
          if git diff --cached --quiet; then
            echo "No new models to commit."
          else
            git commit -m "Auto-convert RVC models to ONNX [skip ci]"
            git push
          fi
