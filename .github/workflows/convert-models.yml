name: Convert RVC models (.pth → .onnx)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rvc-${{ hashFiles('scripts/requirements_export.txt') }}

      - name: Install dependencies
        run: pip install -r scripts/requirements_export.txt

      - name: Download RVC models from Hugging Face
        run: |
          mkdir -p models/pth
          cd /tmp

          echo "Downloading Bibi model..."
          wget -q --show-progress -O bibi.zip \
            https://huggingface.co/pipi00pipi/benjamin_netanyahu/resolve/main/bibi.zip
          unzip -q bibi.zip -d bibi_extracted

          echo "Downloading Trump model..."
          wget -q --show-progress -O trump.zip \
            https://huggingface.co/ThompsonAI9/ThompsonAI9RVC/resolve/main/donaldtrumplowenergy.zip
          unzip -q trump.zip -d trump_extracted

          echo "Copying .pth files (ignoring __MACOSX and .index files)..."
          find bibi_extracted trump_extracted \
            -name "*.pth" \
            ! -path "*/__MACOSX/*" \
            -exec cp {} $GITHUB_WORKSPACE/models/pth/ \;

          echo "Models ready:"
          ls -lh $GITHUB_WORKSPACE/models/pth/

      - name: Clone RVC source (for architecture code only)
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI /tmp/rvc_src

      - name: Convert models to ONNX
        run: |
          mkdir -p /tmp/onnx_out
          python scripts/export_rvc_to_onnx.py \
            --rvc-src /tmp/rvc_src \
            --models models/pth/*.pth \
            --output /tmp/onnx_out
          echo "Converted files:"
          ls -lh /tmp/onnx_out/

      - name: Upload ONNX models as GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rvc-models-latest"

          # Delete old release if exists, then recreate
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "RVC ONNX Models" \
            --notes "Auto-generated ONNX models for in-app AI voice conversion." \
            --prerelease

          # Upload all files
          for f in /tmp/onnx_out/*; do
            echo "Uploading $f..."
            gh release upload "$TAG" "$f" --repo ${{ github.repository }} --clobber
          done

          echo "✓ All models uploaded to release $TAG"
