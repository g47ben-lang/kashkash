name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

  workflow_dispatch:
    inputs:
      build_type:
        description: 'סוג בנייה'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      version_name:
        description: 'גרסה (למשל 1.2.0)'
        required: false
        default: ''
      version_code:
        description: 'קוד גרסה (מספר שלם)'
        required: false
        default: ''
      min_sdk:
        description: 'גרסת אנדרואיד מינימלית (minSdk)'
        required: false
        default: ''
      run_tests:
        description: 'הרץ טסטים'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ONNX models from Release (if available)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rvc-models-latest"
          DEST="app/src/main/assets/models"
          mkdir -p "$DEST"
          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Downloading ONNX models from release $TAG..."
            gh release download "$TAG" --repo ${{ github.repository }} --dir "$DEST" --clobber
            echo "Models bundled into APK:"
            ls -lh "$DEST/"
          else
            echo "No release '$TAG' found — building APK without bundled AI models."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-read-only: false

      - name: Override build variables (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          PROPS_FILE="gradle.properties"
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${{ github.event.inputs.version_name }}/" $PROPS_FILE
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${{ github.event.inputs.version_code }}/" $PROPS_FILE
          fi
          if [ -n "${{ github.event.inputs.min_sdk }}" ]; then
            sed -i "s/^APP_MIN_SDK=.*/APP_MIN_SDK=${{ github.event.inputs.min_sdk }}/" $PROPS_FILE
          fi
          cat $PROPS_FILE

      - name: Run unit tests
        if: github.event.inputs.run_tests != 'false'
        run: gradle test

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: gradle assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        run: gradle assembleRelease

      # ── פרסום ה-APK ב-Release ציבורי (ניתן להורדה ללא התחברות) ──────────
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-latest"
          VERSION=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "Voice Changer APK v${VERSION}" \
            --notes "בנייה אוטומטית מ-commit $(git rev-parse --short HEAD).

## הורדה והתקנה
1. לחץ על הקובץ למטה להורדה
2. בטלפון: הגדרות → אבטחה → אפשר התקנה ממקורות לא ידועים
3. פתח את קובץ ה-APK שהורדת והתקן

## קולות AI (ביבי / טראמפ)
הקולות כלולים בחבילה ויופיעו אוטומטית בפתיחת האפליקציה." \
            --prerelease

          # Upload whichever APK was built
          find app/build/outputs/apk -name "*.apk" | while read apk; do
            echo "Uploading $apk..."
            gh release upload "$TAG" "$apk" \
              --repo ${{ github.repository }} \
              --clobber
          done

          echo ""
          echo "✅ APK זמין להורדה ציבורית:"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"

      # שמירת Artifact גם כן (גיבוי)
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
