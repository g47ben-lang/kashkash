org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ─────────────────────────────────────────
# משתני בנייה - ערוך כאן כדי להתאים אישית
# ─────────────────────────────────────────

# גרסת האפליקציה (מוצגת למשתמש)
APP_VERSION_NAME=1.0.0
# קוד גרסה (מספר שלם, עולה בכל שחרור)
APP_VERSION_CODE=1

# גרסאות אנדרואיד
APP_MIN_SDK=16
APP_TARGET_SDK=34
APP_COMPILE_SDK=34

# מזהה האפליקציה (Application ID)
APP_ID=com.voicechanger.app
# שם האפליקציה (כפי שיופיע בהגדרות הטלפון)
APP_NAME=Voice Changer
