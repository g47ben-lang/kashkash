plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace project.property('APP_ID')
    compileSdk project.property('APP_COMPILE_SDK').toInteger()

    defaultConfig {
        applicationId project.property('APP_ID')
        minSdk        project.property('APP_MIN_SDK').toInteger()
        targetSdk     project.property('APP_TARGET_SDK').toInteger()
        versionCode   project.property('APP_VERSION_CODE').toInteger()
        versionName   project.property('APP_VERSION_NAME')
    }

    signingConfigs {
        release {
            storeFile     file('voicechanger.jks')
            storePassword 'voicechanger123'
            keyAlias      'voicechanger'
            keyPassword   'voicechanger123'
        }
    }

    buildTypes {
        debug {
            // Same signing config as release so APK signature stays consistent
            signingConfig signingConfigs.release
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // ONNX Runtime for on-device AI voice inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
}
